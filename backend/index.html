<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup Form</title>
</head>
<body>
    <h2>Signup Form</h2>
    <form id="signup-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="cart">Cart:</label>
        <input type="text" id="cart" name="cart" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Sign Up</button>
    </form>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async function (event) {
            event.preventDefault(); // Prevent the form from doing a GET request

            const name = document.getElementById('name').value;
            const cart = document.getElementById('cart').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('https://flower-delivery-3.onrender.com/api/user/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, cart, email, password }),
                });

                const data = await response.json();
                console.log('Server Response:', data);
                alert(data.message || 'Signup successful!');
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Please check the console.');
            }
        });
    </script>
</body>
</html>
