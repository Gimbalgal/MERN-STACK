<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers List</title>
</head>
<body>
    <h2>Flowers List</h2>
    <ul id="flowers"></ul>

    <script>
        async function fetchFlowers() {
            try {
                const response = await fetch('https://flower-delivery-5.onrender.com/api/flowers');
                const flowers = await response.json();

                const flowerList = document.getElementById('flowers');
                flowers.forEach(flower => {
                    const listItem = document.createElement('li');
                    listItem.textContent = `Name: ${flower.name}, Price: ${flower.price}, Category: ${flower.category}`;
                    flowerList.appendChild(listItem);
                });
            } catch (error) {
                console.error('Error fetching flowers:', error);
                const flowerList = document.getElementById('flowers');
                flowerList.innerHTML = '<li>Error fetching flower data. Please try again later.</li>';
            }
        }

        // Automatically fetch and display flowers when the page loads
        window.onload = fetchFlowers;
    </script>
</body>
</html>
